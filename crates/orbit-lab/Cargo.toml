[package]
name = "orbit-lab"
description = "ORBIT lab: an experiment registry and differential replay of projection implementations over orbit-core histories."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orbit-lab"

[dependencies]
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
orbit-core = { version = "0.1.0", path = "../orbit-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[features]
# Reliability scenarios: lab fault hooks, orbit-core's fault-injection hooks,
# and the `orbit-reliability` tool. Off by default. orbit-api never enables
# it (a CI step checks its feature graph). The test suite turns it on through
# the self dev-dependency below.
reliability = ["orbit-core/fault-injection"]

[[bin]]
name = "orbit-reliability"
required-features = ["reliability"]

[dev-dependencies]
orbit-lab = { path = ".", features = ["reliability"] }
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true
