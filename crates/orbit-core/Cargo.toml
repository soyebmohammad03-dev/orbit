[package]
name = "orbit-core"
description = "ORBIT core: append-only event streams persisted in SQLite with hash-chained integrity verification."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[features]
# Enables `EventStore::set_fault_hook` for deterministic fault-injection tests.
# Off by default: production builds contain no hook. The test suite turns it on
# through the self dev-dependency below.
fault-injection = []

[dev-dependencies]
orbit-core = { path = ".", features = ["fault-injection"] }
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "event_store"
harness = false

[lints]
workspace = true

[[bench]]
name = "reconstruction"
harness = false

[[bench]]
name = "crash_lab"
harness = false
