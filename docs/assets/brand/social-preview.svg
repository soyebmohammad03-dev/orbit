<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title">
  <title id="title">ORBIT social preview</title>
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5cb8ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#5cb8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5cb8ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b0d10"/>
  <g transform="translate(0 120)">
  <rect width="1280" height="320" fill="#0b0d10"/>
  

  <!-- mark -->
  <g transform="translate(72 96)">
    <circle cx="64" cy="64" r="38" fill="none" stroke="#2f3843" stroke-width="6"/>
    <path d="M64 26 A38 38 0 1 1 26.9 72.1" fill="none" stroke="#5cb8ff" stroke-width="6" stroke-linecap="round"/>
    <g fill="#0b0d10" stroke="#5cb8ff" stroke-width="4">
      <circle cx="64" cy="26" r="7"/>
      <circle cx="100.1" cy="52.3" r="7"/>
      <circle cx="86.3" cy="94.7" r="7"/>
    </g>
    <circle cx="26.9" cy="72.1" r="9" fill="#3fb68b"/>
    <circle cx="64" cy="64" r="5" fill="#e4e8ee"/>
  </g>

  <!-- wordmark and tagline -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="232" y="166" fill="#e4e8ee" font-size="76" font-weight="700" letter-spacing="10">ORBIT</text>
    <text x="236" y="206" fill="#8a94a3" font-size="22">Event history you can replay, compare, stress and prove.</text>
  </g>

  <!-- an event chain: two implementations fold the same history and diverge -->
  <g transform="translate(760 108)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <path d="M0 52 H440" stroke="url(#fade)" stroke-width="2"/>
    <g fill="#111418" stroke="#2f3843">
      <rect x="40" y="36" width="64" height="32" rx="6"/>
      <rect x="136" y="36" width="64" height="32" rx="6"/>
      <rect x="232" y="36" width="64" height="32" rx="6"/>
      <rect x="328" y="36" width="64" height="32" rx="6"/>
    </g>
    <g fill="#8a94a3" text-anchor="middle">
      <text x="72" y="57">#1</text>
      <text x="168" y="57">#2</text>
      <text x="264" y="57">#3</text>
      <text x="360" y="57">#4</text>
    </g>
    <!-- lanes: equal, then a divergence at boundary 2 -->
    <path d="M72 14 H168 C200 14 200 -2 232 -2 H392" fill="none" stroke="#e5604f" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M72 14 H392" fill="none" stroke="#3fb68b" stroke-width="2"/>
    <circle cx="168" cy="14" r="4" fill="#d9a93f"/>
    <text x="176" y="-10" fill="#d9a93f">first divergence</text>
    <!-- verification ticks under each digest link -->
    <g stroke="#3fb68b" stroke-width="2" fill="none">
      <path d="M115 90 l5 5 l9 -10"/>
      <path d="M211 90 l5 5 l9 -10"/>
      <path d="M307 90 l5 5 l9 -10"/>
    </g>
    <text x="140" y="120" fill="#5d6672">sha256 chain verified</text>
  </g>

  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8a94a3">
    <text x="236" y="500">Rust event store · time travel · differential replay · reliability lab</text>
    <text x="236" y="532">statistical performance lab · portable, verifiable evidence bundles</text>
  </g>
</svg>
