[workspace]
resolver = "3"
members = ["crates/orbit-api","crates/orbit-core","crates/orbit-lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# SHA-256 runs over every event, snapshot, artifact and, once per process,
# the executable (orbit-lab's build identity). Unoptimized it is slow enough
# to dominate debug-build tests and the first lab experiment, so it is
# optimized even in dev builds.
[profile.dev.package.sha2]
opt-level = 3
